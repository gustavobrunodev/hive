# The product is "Hive". `productName` is load-bearing beyond the label: it
# names the install directory, the Start-menu entry, and — through
# `app.getName()` — the `userData` folder. `src/main/appIdentity.ts` mirrors
# these two values for dev runs, and `appIdentity.test.ts` fails if they drift.
appId: dev.gustavobruno.hive
productName: Hive
directories:
  buildResources: build
# An allow-list, not a blocklist — measured 2026-09-02, and the reason is a
# number: the blocklist that used to be here named seven things to leave out and
# shipped everything else, producing a **2.7 GB app.asar**. Inside it were the
# app's own `src/`, its `coverage/` HTML report, `.specs/`, `e2e/`, `.claude/`,
# and — recursively — `dist/`, so each build packaged the previous build's
# installer inside the next one.
#
# A blocklist has to be right about the whole future of the repo; every new
# top-level directory ships until someone notices. Nothing here is read at
# runtime except `out/` and `resources/` (`__dirname`-relative, see
# `src/main/index.ts` and `previewProtocol.ts`), so those plus the manifest are
# the whole list. Production `node_modules` are added by electron-builder from
# the dependency graph and need no entry — that is also how the native ASR
# binary gets in.
#
# **A platform's `files` replaces this list, it does not extend it** — measured
# on 2026-09-02, when a `win:`/`linux:` block holding a single `!` exclusion
# quietly reinstated `**/*` and shipped a 2.7 GB archive anyway. So each
# platform below repeats these three entries. The repetition is deliberate and
# `afterPack` is the backstop: it fails the build if a foreign binary survives.
files:
  - 'out/**'
  - 'resources/**'
  - 'package.json'
asarUnpack:
  - resources/**
  # The native ASR addon (M29). Both packages, and both are required: the
  # wrapper (`sherpa-onnx-node`) locates its binary by walking relative paths
  # from its own `__dirname` to the sibling platform package, and inside the
  # archive that walk lands on a path Node cannot `dlopen`.
  # `src/main/asr/asrAddon.ts` points `require` at this unpacked tree.
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-*/**
# The binary is per-platform and npm only installs the host's — see
# `scripts/lib/asrBinary.mjs`. `beforePack` fetches the one this target needs;
# `afterPack` refuses to hand over an app that does not contain it. The second
# hook is the one that matters: a Windows installer carrying a Linux `.so`
# shipped once, and nothing in the build had an opinion about it.
beforePack: scripts/beforePack.mjs
afterPack: scripts/afterPack.mjs
win:
  executableName: Hive
  # Every platform's package is in the dependency graph, so electron-builder
  # includes whichever ones are on disk. Without this, a Windows installer
  # carries ~32 MB of Linux `.so` files it can never load.
  files:
    - 'out/**'
    - 'resources/**'
    - 'package.json'
    - '!node_modules/sherpa-onnx-{linux,darwin}-*/**'
nsis:
  # Assisted, not one-click. A one-click installer is a progress bar and a
  # surprise: the app appears, installed somewhere the user never saw, with
  # nothing on screen that says what it is. The assisted flow is where the
  # Hive welcome page, the sidebar artwork and an install location the user
  # can choose actually exist.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # Branding. Every file here is generated by `npm run build:brand-artwork`
  # from the one authored logo — never hand-edited.
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  installerHeaderIcon: build/installerIcon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  # The custom pages and copy (welcome, finish, uninstall) live here.
  include: build/installer.nsh
  # The app's UI is pt-BR; an installer in English would be the first thing
  # the user sees and the only English in the product.
  installerLanguages:
    - pt_BR
  language: '1046' # LANG_PORTUGUESE_BRAZILIAN
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: Hive
  uninstallDisplayName: Hive
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: false
  # Leave the vault, chat history and settings on disk. Uninstalling is not
  # the same request as "throw away my work", and the migration in
  # `userDataMigration.ts` exists precisely so that data survives.
  deleteAppDataOnUninstall: false
mac:
  files:
    - 'out/**'
    - 'resources/**'
    - 'package.json'
    - '!node_modules/sherpa-onnx-{linux,win}-*/**'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  executableName: hive
  files:
    - 'out/**'
    - 'resources/**'
    - 'package.json'
    - '!node_modules/sherpa-onnx-{darwin,win}-*/**'
  target:
    - AppImage
    - snap
    - deb
  maintainer: contato@gustavobruno.dev
  category: Development
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
