<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NotaAutoadesiva</title>
<style>
  body { padding: 20px; background: var(--quadro); --z: 1; }
  .vitrine { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
  .coluna { display: grid; gap: 8px; justify-items: start; }
  .rot { font-size: 0.75rem; font-weight: 600; color: var(--tinta-3); }
  .notas { display: grid; grid-template-columns: repeat(4, 230px); gap: 22px; align-items: start; }
</style>
</head>
<body>
<div class="notas"><button class="nota nota-likert" style="--r:1deg" title="O cliente simula com uma taxa e encontra outra na confirmação, sem aviso de quanto tempo a cotação vale."><span class="nota-check" aria-hidden="true"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span class="nota-titulo">A cotação muda entre simular e confirmar</span><span class="nota-pe"><span class="nota-vol"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"></path></svg><span>412 menções</span></span><span class="nota-imp alto"><span class="sr">Impacto </span>Alto</span><span class="tendencia t-sobe" title="Comparado aos 90 dias anteriores"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9.5 7H17v7.5"></path></svg>22%</span></span></button><button class="nota nota-voz" style="--r:-1.2deg" title="A remessa volta para a conta quando o banco do beneficiário recusa os dados, e o cliente só descobre olhando o extrato."><span class="nota-check" aria-hidden="true"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span class="nota-titulo">Minha transação de câmbio estornou e não recebi nenhuma notificação</span><span class="nota-pe"><span class="nota-vol"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19c0 1.4-1.6 2.4-4 2.4h-2"></path></svg><span>1.284 ligações</span></span><span class="nota-imp alto"><span class="sr">Impacto </span>Alto</span><span class="tendencia t-sobe" title="Comparado aos 90 dias anteriores"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9.5 7H17v7.5"></path></svg>31%</span></span></button><button class="nota nota-fullstory" style="--r:-0.6deg" title="O botão fica desabilitado até o aceite dos termos, sem dizer por quê. O cliente toca várias vezes seguidas."><span class="nota-check" aria-hidden="true"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span class="nota-titulo">Rage click no botão Confirmar remessa</span><span class="nota-pe"><span class="nota-vol"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l11 5.2-4.7 1.6-1.6 4.7z"></path><path d="M14.5 14.5l4 4"></path><path d="M6.2 5.2L4.6 3.6M10.2 4.4V2.4M4.4 10.2H2.4"></path></svg><span>2.140 clientes</span></span><span class="nota-imp alto"><span class="sr">Impacto </span>Alto</span><span class="tendencia t-sobe" title="Comparado aos 90 dias anteriores"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9.5 7H17v7.5"></path></svg>26%</span></span></button><button class="nota nota-likert" style="--r:1.2deg" aria-pressed="true" title="Depois de enviar, o cliente só vê “até 2 dias úteis” e não sabe em que etapa a remessa está."><span class="nota-check" aria-hidden="true"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span class="nota-titulo">Não sei quando o dinheiro chega lá fora</span><span class="nota-pe"><span class="nota-vol"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"></path></svg><span>338 menções</span></span><span class="nota-imp alto"><span class="sr">Impacto </span>Alto</span><span class="tendencia t-sobe" title="Comparado aos 90 dias anteriores"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9.5 7H17v7.5"></path></svg>9%</span></span></button></div>
</body>
</html>
