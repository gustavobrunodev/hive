<!doctype html>

<head>

<title>ChipDeFonte</title>
<style>
  body { padding: 20px; background: var(--quadro); --z: 1; }
  .vitrine { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }

</style>
</head>
<body>
<div class="coluna">
  <div class="vitrine"><span class="chip-fonte f-likert"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"></path></svg></span>
<span class="chip-fonte f-voz"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19c0 1.4-1.6 2.4-4 2.4h-2"></path></svg></span>
<span class="chip-fonte f-fullstory"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l11 5.2-4.7 1.6-1.6 4.7z"></path><path d="M14.5 14.5l4 4"></path><path d="M6.2 5.2L4.6 3.6M10.2 4.4V2.4M4.4 10.2H2.4"></path></svg></span></div>
  <div class="vitrine" style="max-width:420px"><span class="chip-dor"><span class="chip-fonte f-likert"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"></path></svg></span><span class="chip-txt">Não sei quando o dinheiro chega lá fora</span><span class="chip-x" role="button" tabindex="0" aria-label="Tirar a citação"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></span></div>
