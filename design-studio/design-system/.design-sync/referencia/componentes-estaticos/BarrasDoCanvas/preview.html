<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BarrasDoCanvas</title>
<style>
  body { padding: 20px; background: var(--quadro); --z: 1; }
  .vitrine { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
  .coluna { display: grid; gap: 8px; justify-items: start; }
  .rot { font-size: 0.75rem; font-weight: 600; color: var(--tinta-3); }
  body { padding: 0; }
  .canvas { height: 200px; background-color: var(--quadro); background-image: radial-gradient(var(--ponto) 1.15px, var(--quadro) 1.4px); background-size: 22px 22px; }
</style>
</head>
<body>
<div class="canvas"><div class="canvas-topo"><div class="propostas" role="tablist" aria-label="Propostas"><button class="prop-aba" role="tab" aria-selected="false" title="Recriado a partir de 3 prints e 1 sessão do FullStory.">Atual</button><button class="prop-aba" role="tab" aria-selected="true" title="Estorno como passo da linha do tempo, com motivo e próximo passo; aviso por notificação; Confirmar guia o que falta."><span class="ponto-ativa" aria-hidden="true"></span>A · Status que avisa</button><button class="prop-aba" role="tab" aria-selected="false" title="O caminho do dinheiro em três paradas, do Brasil ao banco do beneficiário.">B · Rastreio do envio</button><button class="prop-aba descartada" role="tab" aria-selected="false" title="Faixa de aviso no topo do app. Descartada: o aviso some quando o cliente sai da tela.">C · Aviso no topo</button></div><button class="prop-nova" title="Pedir outra abordagem ao agente" aria-label="Nova Proposta"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg><span class="ferr-txt">Nova</span></button><span class="espaco"></span><div class="barra-flutua"><button class="ferr" aria-pressed="true" title="Celular" aria-label="Ver no celular"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></button><button class="ferr" aria-pressed="false" title="Desktop" aria-label="Ver no desktop"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg></button><span class="ferr-sep"></span><button class="ferr" title="Apresentar" aria-label="Apresentar"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20l4-4 4 4"></path></svg><span class="ferr-txt">Apresentar</span></button><button class="ferr" title="Compartilhar" aria-label="Compartilhar"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"></path><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"></path></svg><span class="ferr-txt">Compartilhar</span></button></div></div><div class="ferramentas barra-flutua" role="toolbar" aria-label="Ferramentas do quadro"><button class="ferr" aria-pressed="false" title="Mover"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5l13 5.6-5.6 1.9-1.9 5.6z"></path><path d="M13 13l6 6"></path></svg><span class="ferr-txt">Mover</span></button><button class="ferr" aria-pressed="false" title="Comentar"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18.5V6.5A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5v8a1.5 1.5 0 0 1-1.5 1.5H9z"></path><path d="M9 10h6M9 13h3.5"></path></svg><span class="ferr-txt">Comentar</span></button><button class="ferr" aria-pressed="false" title="Editar"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.8L15.5 4.9a2 2 0 0 1 2.8 0l.8.8a2 2 0 0 1 0 2.8L8.8 18.8z"></path><path d="M13.5 7l3.5 3.5"></path></svg><span class="ferr-txt">Editar</span></button><button class="ferr" aria-pressed="true" title="Inserir"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M12 8.5v7M8.5 12h7"></path></svg><span class="ferr-txt">Inserir</span></button><button class="ferr" aria-pressed="false" title="Ajustar"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg><span class="ferr-txt">Ajustar</span></button><span class="ferr-sep"></span><button class="ferr pri" title="Navegar como cliente"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"></path></svg>Testar</button><span class="ferr-sep"></span><button class="ferr" aria-label="Diminuir zoom"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2M8.5 11h5"></path></svg></button><span class="ferr ferr-zoom" aria-live="polite">88%</span><button class="ferr" aria-label="Aumentar zoom"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2M8.5 11h5M11 8.5v5"></path></svg></button><button class="ferr" title="Enquadrar tudo" aria-label="Enquadrar tudo"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"></path></svg></button></div></div>
