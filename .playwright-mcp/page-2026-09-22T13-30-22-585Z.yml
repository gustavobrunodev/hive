                - paragraph [ref=e1177]:
                  - strong [ref=e1178]: "One thing is not in any table: operator posture."
                  - code [ref=e1179]: tlc harness mode paired|solo|focus
                  - text: changes how much the agent surfaces and what earns an interruption. It switches no gate on and weakens no verification — the evidence bar is identical at all three (
                  - link [ref=e1180] [cursor=pointer]:
                    - /url: /tech-leads-club/harness-toolkit/blob/main/docs/decisions/ad-025.md
                    - code [ref=e1181]: docs/decisions/ad-025.md
                  - text: ).
                - generic [ref=e1182]:
                  - heading "One rail takes a rule you write" [level=3] [ref=e1183]
                  - 'link "Permalink: One rail takes a rule you write" [ref=e1184] [cursor=pointer]':
                    - /url: "#one-rail-takes-a-rule-you-write"
                - paragraph [ref=e1187]:
                  - text: Every other capability is a switch.
                  - strong [ref=e1188]: Operator rules
                  - text: "is a switch plus a file, because the trigger and the proof are yours:"
                  - emphasis [ref=e1189]: on this trigger, this must have happened, otherwise do that.
                  - text: "No pull request without a review, for instance:"
                - generic [ref=e1190]:
                  - generic [ref=e1191]: "--- on: pr-open require: - subagent(the-jury) since HEAD otherwise: deny --- Convene the jury on this branch. Checklist: docs/review-checklist.md"
                  - button "Copy code to clipboard" [ref=e1193] [cursor=pointer]
                - paragraph [ref=e1197]:
                  - text: Save it as one markdown file per rule in
                  - code [ref=e1198]: .tlc/harness/rules/
                  - text: for this repository, or in the runtime home's
                  - code [ref=e1199]: rules/
                  - text: for every repository on this machine, and set
                  - code [ref=e1200]: "rules.enabled: true"
                  - text: ". The proof has to be something the harness observed — a subagent that ran, a command that completed, a gate that passed, a file that changed — so the agent cannot write one: that store is under the project state directory, which the floor refuses it."
                - paragraph [ref=e1201]:
                  - code [ref=e1202]: tlc harness doctor
                  - text: lists every rule it loaded, and says so when the switch is on and no file was found. The full grammar — six triggers, four proof kinds, four verdicts and how each lands at the stop — is
                  - code [ref=e1203]: tlc harness help rules
                  - text: .
                - paragraph [ref=e1204]:
                  - strong [ref=e1205]: Why not the editor's own rules?
                  - text: "Because a rule file there is context, not a gate: activation is a mode you pick, always-apply defaults to off, and one of the modes leaves it to the model to decide whether to load the rule at all. This is not a replacement for that file — it is the layer underneath it. The editor's rule says what the agent should do; this one says what must be provably true before it may."
                - paragraph [ref=e1206]:
                  - text: The fair comparison is with the editors'
                  - strong [ref=e1207]: hooks
                  - text: ", which are deterministic too. Three things separate them from this, taken from their own reference rather than from opinion: there is no prerequisite mechanism and no state store, so \"X requires Y to have happened\" is custom logic you write per event; the state you would keep lives in an ordinary repository path the agent can write, while a proof here lives where the floor refuses it; and one host's stop hook cannot refuse completion at all, so the same requirement has to mean something different on each — which is what the capability table and the degrade step already do. A hook is a program per host per repository, fail-open unless it opts out. A rule is five lines of frontmatter, two tiers, both hosts ("
                  - link [ref=e1208] [cursor=pointer]:
                    - /url: /tech-leads-club/harness-toolkit/blob/main/docs/decisions/ad-100.md
                    - code [ref=e1209]: docs/decisions/ad-100.md
                  - text: ).
