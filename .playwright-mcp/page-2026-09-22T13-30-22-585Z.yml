                  - text: assesses the harness against a published agentic-risk taxonomy — four risks covered, five partial, one not applicable — and states what each row leaves open. It is a self-assessment, and the control names in it are generated from the same catalogs this README's tables come from, so a rail that is renamed or removed fails the build rather than leaving a claim standing.
