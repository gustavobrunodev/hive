                - paragraph [ref=e1274]: You saw a message and want to know which rule produced it.
                - list [ref=e1275]:
                  - listitem [ref=e1276]:
                    - strong [ref=e1277]: The message names its rule.
                    - text: A floor denial ends in
                    - code [ref=e1278]: rule=<name>
                    - text: — look it up in
                    - link "tier 1" [ref=e1279] [cursor=pointer]:
                      - /url: "#tier-1--the-floor-no-configuration-reaches-it"
                    - text: . A rail's block names the gate.
                  - listitem [ref=e1280]:
                    - strong [ref=e1281]:
                      - code [ref=e1282]: tlc harness obs report
                    - text: attributes every refusal and interruption in the session to a rule, so "seven interruptions" becomes "six from the posture, one from the catastrophic rule".
                  - listitem [ref=e1283]:
                    - strong [ref=e1284]:
                      - code [ref=e1285]: tlc harness attest
                    - text: "is the same thing for a reviewer: which policy the session ran under, whether it changed mid-session, and every gate outcome, hash-chained so a removed record is detectable."
                  - listitem [ref=e1286]:
                    - strong [ref=e1287]:
                      - code [ref=e1288]: tlc harness doctor
                    - text: explains the absence of a decision — a rail you expected to fire and did not is usually one that is off, or on with nothing configured to enforce.
                - paragraph [ref=e1289]:
                  - text: Two limits worth stating. The harness records the decisions it made; it never learns your answer to an
                  - code [ref=e1290]: ask
                  - text: ", so it reports a rate and its attribution, never a precision or an accuracy. And the attestation is chained, not signed: it detects a rewritten record and proves nothing about authorship."
                - generic [ref=e1291]:
                  - heading "What it covers, and what it does not" [level=3] [ref=e1292]
                  - 'link "Permalink: What it covers, and what it does not" [ref=e1293] [cursor=pointer]':
