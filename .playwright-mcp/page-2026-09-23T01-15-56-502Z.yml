                - paragraph [ref=f17e775]: Promoted to Software Engineering Specialist after leading the design, delivery, and technical governance of the squad’s core frontend foundations for Itaú Unibanco’s Foreign Exchange domain.
                - paragraph [ref=f17e776]
                - paragraph [ref=f17e777]: • Served as the squad’s primary frontend technical reference, guiding architecture decisions, engineering standards, delivery quality, and knowledge sharing throughout the software development lifecycle.
                - paragraph [ref=f17e778]
                - paragraph [ref=f17e779]: • Extended this impact across Itaú’s Foreign Exchange engineering community by creating reusable solutions, technical documentation, presentations, and hands-on workshops that helped squads improve consistency, technical maturity, and autonomy.
                - paragraph [ref=f17e780]
                - paragraph [ref=f17e781]: • Designed and scaled a governed model for creating, distributing, and managing AI tools—including Skills, MCP servers, and Plugins—which became Itaú’s official solution for AI tool management. Tools I authored or co-authored surpassed 10,000 internal downloads.
                - paragraph [ref=f17e782]
                - paragraph [ref=f17e783]: • Co-created HIVE (Hybrid Intelligent Value Engineering), a structured operating model and framework for applying AI across the entire SDLC—from upstream ideation to production-ready code—supported by a governed installer for curated, ready-to-use AI tools.
                - paragraph [ref=f17e784]
                - paragraph [ref=f17e785]: • HIVE surpassed 1,000 internal downloads, expanded beyond the Foreign Exchange community, and was recognized as Zup’s official framework within Itaú for enabling hybrid human–AI engineering teams.
