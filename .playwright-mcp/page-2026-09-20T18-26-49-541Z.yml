                  - generic [ref=e225]:
                    - paragraph [ref=e226]: Nessa aula construímos um ERP do zero para entender, nível a nível, por que um prompt solto não basta e o que precisa existir em volta do modelo para o código sair validado. Começamos com um "implemente isso" seco, passamos por plan mode, criamos uma skill de spec e verificação, rodamos o tlc-spec-driven completo e chegamos na versão lean, onde o modelo implementa livre e um sub agent prova o trabalho contra um checklist. No caminho vemos o que mudou nos modelos nos últimos meses e por que parte do harness que a gente construía já virou babysitting.
