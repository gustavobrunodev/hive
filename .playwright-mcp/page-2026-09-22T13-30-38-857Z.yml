        - paragraph [ref=e114]: An agent skill is a packaged set of instructions — a Markdown file, plus optional scripts, templates and reference docs — that you install into an AI coding agent. Once installed, the agent loads the skill when the task matches its triggers, so it follows the same reviewed workflow every time instead of improvising. Every skill in this registry is security-scanned and version-tracked.
